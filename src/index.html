<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Home</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="hero">
        <img src="/images/banner-sm.jpg" srcset="/images/banner-sm.jpg 500w, /images/banner.jpg 1200w" alt="image of a high mountain lake" />
        <div class="logo logo--square">
          <img src="/images/noun_Tent_2517.svg" alt="tent image for logo" />
          <div>Sleep<span class="highlight">Outside</span></div>
        </div>
        <div class="mission">
          <p>Our mission is to provide you with everything you need to sleep outside comfortably at an affordable price.</p>
        </div>
      </section>

      <section class="category-cards">
        <h2>Our Categories</h2>
        <div class="category-grid">
          <a href="/product_listing/?category=tents" class="category-item">
            <img src="/images/category-tents.svg" alt="Tents category" />
            <p>Tents</p>
          </a>
          <a href="/product_listing/?category=backpacks" class="category-item">
            <img src="/images/category-backpacks.svg" alt="Backpacks category" />
            <p>Backpacks</p>
          </a>
          <a href="/product_listing/?category=sleeping-bags" class="category-item">
            <img src="/images/category-sleepingbags.svg" alt="Sleeping Bags category" />
            <p>Sleeping Bags</p>
          </a>
          <a href="/product_listing/?category=hammocks" class="category-item">
            <img src="/images/category-hammocks.svg" alt="Hammocks category" />
            <p>Hammocks</p>
          </a>
        </div>
      </section>
    </main>

    <footer id="main-footer"></footer>

    <script src="/js/main.js" type="module"></script>
  </body>
</html>
